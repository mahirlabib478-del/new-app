name: Study OS Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app
          printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"study-os-ci","storage_bucket":"study-os-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.aistudio.studyos.kxvpt"}},"api_key":[{"current_key":"CI_ONLY_DUMMY_KEY"}]}],"configuration_version":"1"}' > app/google-services.json

      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - run: ./gradlew testDebugUnitTest --continue

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: study-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
