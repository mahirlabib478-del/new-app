name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: bash tool/bootstrap_android.sh
      - name: Verify notification manifest configuration
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.USE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' android/app/src/main/AndroidManifest.xml
          grep -q 'ScheduledNotificationReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'ScheduledNotificationBootReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.4' android/app/build.gradle.kts
          grep -q 'targetSdk = 35' android/app/build.gradle.kts
          grep -q 'android:icon="@drawable/study_os_logo"' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/ic_notification.xml
          test -f android/app/src/main/res/raw/keep.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Configure signed CI release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          chmod 600 android/app/release-key.jks
          keytool -list -keystore android/app/release-key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'create("release")' not in text:
              marker = '    buildTypes {'
              signing = '''    signingConfigs {
                  create("release") {
                      storeFile = file("release-key.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              '''
              text = text.replace(marker, signing + marker, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          path.write_text(text)
          PY

      - name: Build Android release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify built release notification configuration
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -q 'android.permission.POST_NOTIFICATIONS'
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump xmltree build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml | grep -q 'ScheduledNotificationReceiver'
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump resources build/app/outputs/flutter-apk/app-release.apk | grep -q 'ic_notification'

      - name: Package Android APKs
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p build/apk-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk build/apk-artifacts/study-os-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/apk-artifacts/study-os-release.apk
      - name: Upload Android APKs
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: study-os-apks
          path: build/apk-artifacts
          if-no-files-found: error
