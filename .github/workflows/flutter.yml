name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android platform
        run: flutter create --platforms=android --org com.mahirlabib .

      - name: Configure Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "isCoreLibraryDesugaringEnabled" not in text:
              marker = "    defaultConfig {"
              if marker not in text:
                  raise SystemExit("Could not find android defaultConfig block")
              text = text.replace(
                  marker,
                  "    compileOptions {\n"
                  "        isCoreLibraryDesugaringEnabled = true\n"
                  "    }\n\n"
                  + marker,
                  1,
              )

          dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
          if "desugar_jdk_libs" not in text:
              text += "\n\ndependencies {\n" + dependency + "}\n"

          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: study-os-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
