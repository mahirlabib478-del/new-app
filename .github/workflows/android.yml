# CI: Android build + unit-test verification
name: Android CI

on:
  push:
    branches: [main, account-auth-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            echo "No debug.keystore found; generating a standard debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s debug.keystore

      - name: Ensure Firebase config for CI build
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "google-services.json is not committed; creating CI-only placeholder config..."
            cat > app/google-services.json <<'EOF'
{
  "project_info": {
    "project_number": "000000000000",
    "project_id": "study-os-ci",
    "storage_bucket": "study-os-ci.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
        "android_client_info": {
          "package_name": "com.aistudio.studyos.kxvpt"
        }
      },
      "api_key": [
        {
          "current_key": "CI_ONLY_DUMMY_KEY"
        }
      ]
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
