name: Study OS Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Prepare debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate Firebase configuration
        run: |
          test -f app/google-services.json
          grep -q '"project_id": "study-os-98831"' app/google-services.json
          grep -q '"package_name": "com.aistudio.studyos.kxvpt"' app/google-services.json
          if grep -q 'CI_ONLY_DUMMY_KEY' app/google-services.json; then
            echo "Dummy Firebase API key detected"
            exit 1
          fi

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: study-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
