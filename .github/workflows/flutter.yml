name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: bash tool/bootstrap_android.sh
      - name: Verify notification manifest configuration
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' android/app/src/main/AndroidManifest.xml
          grep -q 'ScheduledNotificationReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'ScheduledNotificationBootReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.4' android/app/build.gradle.kts
          grep -q 'targetSdk = 35' android/app/build.gradle.kts
          grep -q 'android:icon="@drawable/study_os_logo"' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/ic_notification.xml
          test -f android/app/src/main/res/raw/keep.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Verify built release notification configuration
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -q 'android.permission.POST_NOTIFICATIONS'
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump xmltree build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml | grep -q 'ScheduledNotificationReceiver'
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump resources build/app/outputs/flutter-apk/app-release.apk | grep -q 'ic_notification'
      - name: Package Android APKs
        run: |
          mkdir -p build/apk-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk build/apk-artifacts/study-os-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/apk-artifacts/study-os-release.apk
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: study-os-apks
          path: build/apk-artifacts
          if-no-files-found: error
